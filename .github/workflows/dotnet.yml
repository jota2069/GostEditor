name: .NET CI

on:
  push:
    branches:
      - develop
      - "feature/**"
  pull_request:
    branches:
      - develop
      - "feature/**"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore GostEditor.sln

      - name: Build
        run: dotnet build GostEditor.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test GostEditor.sln --configuration Release --no-build
